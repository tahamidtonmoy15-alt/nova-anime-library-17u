plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nova.anime'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nova.anime'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official VideoLAN LibVLC Android engine (stable 3.7.1 release).
    implementation 'org.videolan.android:libvlc-all:3.7.1'
}
